# Azure DevOps pipeline: runs the Playwright suite and publishes results to the
# run's "Tests" tab (JUnit) plus the HTML report and failure artifacts.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

schedules:
  - cron: '0 2 * * *'
    displayName: Nightly regression (02:00 UTC)
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest

variables:
  CI: 'true'
  npm_config_cache: $(Pipeline.Workspace)/.npm

steps:
  - task: NodeTool@0
    displayName: Use Node.js 20
    inputs:
      versionSpec: '20.x'

  - task: Cache@2
    displayName: Cache npm
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: $(npm_config_cache)

  - script: npm ci
    displayName: Install dependencies

  - script: npx playwright install --with-deps chromium
    displayName: Install Playwright Chromium

  - script: npm run typecheck
    displayName: Type check

  - script: npx playwright test
    displayName: Run Playwright tests

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results/junit.xml
      testRunTitle: 'SauceDemo E2E - $(Build.SourceBranchName) #$(Build.BuildNumber)'
      failTaskOnFailedTests: false

  - script: npm run summary
    displayName: Results summary
    condition: succeededOrFailed()

  - task: PublishPipelineArtifact@1
    displayName: Publish HTML report
    condition: succeededOrFailed()
    inputs:
      targetPath: playwright-report
      artifact: playwright-report-$(System.JobAttempt)

  - task: PublishPipelineArtifact@1
    displayName: Publish failure artifacts (screenshots, videos, traces)
    condition: failed()
    inputs:
      targetPath: test-results
      artifact: test-results-$(System.JobAttempt)
